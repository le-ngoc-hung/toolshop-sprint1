name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-api:${TOOLSHOP_TAG:-2.5}
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - host=localhost
      - DISABLE_LOGGING=true
    depends_on:
      - mariadb

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-${SPRINT:-sprint5}-ui:${TOOLSHOP_TAG:-2.5}
    ports:
      - "4200:4200"
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
